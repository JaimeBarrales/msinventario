# Entorno simulado de despliegue (staging) orquestado con Docker Compose
# (clase 2.2.1: servicios, dependencias con healthcheck y límites de recursos).
#
#   - mysql:  base de datos MySQL con volumen persistente y healthcheck
#   - java:   microservicio, 2 réplicas, límites de recursos y endurecimiento
#   - proxy:  Nginx como balanceador de carga entre las réplicas
#
# Uso local:   docker compose up -d --build
# En el CI:    IMAGE=ghcr.io/<owner>/ms-inventario@sha256:... docker compose up -d --wait

name: inventario

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword_dev}
      MYSQL_DATABASE: inventario
      MYSQL_USER: ${DB_USER:-inventario}
      MYSQL_PASSWORD: ${DB_PASSWORD:-inventario_dev}
    volumes:
      - mysql-data:/var/lib/mysql
    # Sin "ports": la base de datos NO se expone fuera de la red interna.
    healthcheck:
      # -h 127.0.0.1 fuerza conexión TCP: durante la inicialización MySQL levanta un
      # servidor temporal solo por socket, así evitamos marcarlo "sano" antes de tiempo.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 384M
          cpus: "0.25"

  java:
    image: ${IMAGE:-ms-inventario:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventario
      DB_USER: ${DB_USER:-inventario}
      DB_PASSWORD: ${DB_PASSWORD:-inventario_dev}
      DB_POOL_SIZE: "5"
      APP_ENV: staging-compose
    depends_on:
      # Espera a que MySQL esté realmente listo (healthcheck), no solo iniciado
      mysql:
        condition: service_healthy
    deploy:
      # Escalabilidad horizontal: varias réplicas detrás del proxy.
      # Se puede cambiar en caliente con: docker compose up -d --scale java=3
      replicas: 2
      resources:
        limits:
          # Máximo uso de memoria y CPU por réplica del servicio Java
          memory: 512M
          cpus: "1.0"
        reservations:
          # Recursos reservados por réplica
          memory: 256M
          cpus: "0.25"
    # Seguridad: sistema de archivos de solo lectura y sin escalamiento de privilegios
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks: [backend, frontend]
    restart: unless-stopped

  proxy:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PUERTO:-8080}:80"
    depends_on:
      java:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [frontend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

networks:
  # La base de datos solo es accesible desde la red interna "backend"
  backend:
    internal: true
  frontend: {}

volumes:
  mysql-data: {}
