spring:
  application:
    name: ms-inventario
  # Por defecto usa H2 en memoria (desarrollo y pruebas).
  # En Docker Compose / Kubernetes se inyecta MySQL vía variables de entorno.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:inventario;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      # Sin mapeos XML: Hibernate no necesita JAXB (excluido en el pom.xml por seguridad)
      hibernate.xml_mapping_enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
    build:
      enabled: true

# Trazabilidad: el pipeline inyecta el commit y la ejecución que generó la imagen.
info:
  app:
    nombre: ${spring.application.name}
    commit: ${GIT_COMMIT:local}
    pipeline-run: ${PIPELINE_RUN:local}
    entorno: ${APP_ENV:local}
