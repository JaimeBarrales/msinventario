# Balanceador de carga para las réplicas del servicio "java".
# El DNS interno de Docker resuelve "java" a todas las réplicas; "resolver" + variable
# fuerza a Nginx a re-resolver para detectar réplicas nuevas al escalar.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_tokens off;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $backend http://java:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
