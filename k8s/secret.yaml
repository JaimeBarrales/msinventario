# Credenciales de ejemplo SOLO para el entorno simulado (kind).
# En el pipeline se sobrescriben con los secretos de GitHub K8S_DB_PASSWORD y
# K8S_DB_ROOT_PASSWORD (si existen). En un entorno real se usaría un gestor de
# secretos (Sealed Secrets, External Secrets, Vault) y nunca se versionaría.
apiVersion: v1
kind: Secret
metadata:
  name: ms-inventario-db
  labels:
    app.kubernetes.io/name: ms-inventario
type: Opaque
stringData:
  DB_USER: inventario
  DB_PASSWORD: inventario_dev
  DB_ROOT_PASSWORD: rootpassword_dev
