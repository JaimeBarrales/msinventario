# Autoescalado horizontal: entre 2 y 6 réplicas según uso de CPU.
# No se escala por memoria: la JVM reserva heap y no lo libera, lo que
# provocaría escalados innecesarios.
# Requiere metrics-server (el pipeline lo instala en el clúster kind).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-inventario
  labels:
    app.kubernetes.io/name: ms-inventario
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-inventario
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
